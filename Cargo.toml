[package]
name = "zonesnap"
version = "1.3.0"
edition = "2021"
description = "Lightweight, portable Windows window-snapping and window-management utility"
license = "GPL-3.0-only"
repository = "https://github.com/PlatyLord/zonesnap-rs"
readme = "README.md"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
